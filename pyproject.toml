[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-macvendors-mcp"
version = "2.0.0"
description = "An MCP server for MAC address vendor lookups and brand prefix search"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "mac-address", "oui", "vendor", "network"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/clearminds/clr-macvendors-mcp"

[project.scripts]
clr-macvendors-mcp = "clr_macvendors_mcp.server:main"
