[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macvendors-mcp-server"
version = "1.0.0"
description = "An MCP server for MAC address vendor lookups"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "mac-address", "oui", "vendor", "network"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/clearminds/macvendors-mcp-server"

[project.scripts]
macvendors-mcp-server = "macvendors_mcp_server.server:main"
